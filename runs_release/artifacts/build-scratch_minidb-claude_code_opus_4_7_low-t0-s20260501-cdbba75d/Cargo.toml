[package]
name = "minidb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "minidb"
path = "src/main.rs"

[lib]
name = "minidb"
path = "src/lib.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = false
