[package]
name = "minidb"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.11"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "minidb"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
