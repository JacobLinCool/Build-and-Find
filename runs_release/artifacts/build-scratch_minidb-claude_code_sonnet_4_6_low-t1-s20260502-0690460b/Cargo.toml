[package]
name = "minidb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "minidb"
path = "src/main.rs"

[dependencies]
crc32fast = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rustyline = "14"
csv = "1"
byteorder = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
