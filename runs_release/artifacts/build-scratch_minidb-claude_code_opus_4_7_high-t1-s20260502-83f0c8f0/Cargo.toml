[package]
name = "minidb"
version = "0.1.0"
edition = "2021"
description = "Embeddable SQL-subset relational database in pure Rust"
license = "MIT"

[[bin]]
name = "minidb"
path = "src/main.rs"

[lib]
name = "minidb"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"

[profile.test]
opt-level = 1
