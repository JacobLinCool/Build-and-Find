[package]
name = "nanoweb"
version = "0.1.0"
edition = "2021"
description = "A self-contained HTTP/1.1 web framework and server"
license = "MIT OR Apache-2.0"

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1"
percent-encoding = "2"
rand = "0.8"
async-trait = "0.1"
form_urlencoded = "1"
parking_lot = "0.12"

rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
hex = "0.4"
rand = "0.8"
base64 = "0.22"

[[bin]]
name = "nanoweb"
path = "src/main.rs"

[lib]
name = "nanoweb"
path = "src/lib.rs"
