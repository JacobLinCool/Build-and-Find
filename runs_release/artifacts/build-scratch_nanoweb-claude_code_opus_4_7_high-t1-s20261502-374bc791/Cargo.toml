[package]
name = "nanoweb"
version = "0.1.0"
edition = "2021"
description = "A self-contained HTTP/1.1 web framework and server"
license = "MIT OR Apache-2.0"

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
rustls-pemfile = { version = "2", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[[bin]]
name = "nanoweb"
path = "src/main.rs"

[lib]
name = "nanoweb"
path = "src/lib.rs"
