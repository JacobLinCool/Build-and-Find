[package]
name = "minidb"
version = "0.1.0"
edition = "2021"
description = "An embeddable SQL-subset relational database"
authors = ["minidb contributors"]

[[bin]]
name = "minidb"
path = "src/main.rs"

[lib]
name = "minidb"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.4"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
byteorder = "1"
rustyline = "14"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
