[package]
name = "minidb"
version = "0.1.0"
edition = "2021"
description = "An embeddable SQL-subset relational database"

[dependencies]
log = "0.4"
env_logger = "0.11"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
atty = "0.2"

[profile.release]
opt-level = 3
lto = true
