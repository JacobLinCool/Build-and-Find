[package]
name = "nanoweb"
version = "0.1.0"
edition = "2021"

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-pemfile"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
mime = "0.3"
mime_guess = "2"
flate2 = "1"
once_cell = "1"
thiserror = "1"
rustls = { version = "0.23", optional = true, features = ["ring"] }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
rand = "0.8"
httpdate = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "nanoweb"
path = "src/lib.rs"

[[bin]]
name = "nanoweb"
path = "src/main.rs"
