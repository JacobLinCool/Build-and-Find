[package]
name = "minidb"
version = "0.1.0"
edition = "2021"
description = "An embeddable SQL-subset relational database"

[[bin]]
name = "minidb"
path = "src/main.rs"

[dependencies]
crc32fast = "1.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
