[package]
name = "minidb"
version = "0.1.0"
edition = "2021"
description = "An embeddable SQL-subset relational database"

[[bin]]
name = "minidb"
path = "src/main.rs"

[lib]
name = "minidb"
path = "src/lib.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

[dev-dependencies]
tempfile = "3"
