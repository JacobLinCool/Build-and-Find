[package]
name = "minidb"
version = "0.1.0"
edition = "2021"

[lib]
name = "minidb"
path = "src/lib.rs"

[[bin]]
name = "minidb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
crc32fast = "1.4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

