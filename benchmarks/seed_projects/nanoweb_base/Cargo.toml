[package]
name = "nanoweb"
version = "0.1.0"
edition = "2021"
description = "A tiny HTTP/1.1 web framework."
license = "Apache-2.0"

[[bin]]
name = "nanoweb"
path = "src/main.rs"

[lib]
name = "nanoweb"
path = "src/lib.rs"

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-pemfile"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
