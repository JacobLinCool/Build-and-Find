[package]
name = "minidb"
version = "0.1.0"
edition = "2021"
description = "A minimal SQL-subset relational database engine"
license = "Apache-2.0"

[[bin]]
name = "minidb"
path = "src/main.rs"

[lib]
name = "minidb"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = false
