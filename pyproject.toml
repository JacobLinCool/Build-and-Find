[project]
name = "build-and-find"
version = "0.1.0"
description = "Build-and-Find: a benchmark for coding-agent project legibility and intent recovery"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Build-and-Find Authors" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "aiohttp>=3.10",
]

[project.scripts]
bnf = "bnf.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
paper = [
    "adjusttext>=1.3.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
